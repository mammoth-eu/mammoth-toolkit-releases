# PIPELINE DEFINITION
# Name: bias-scan
# Inputs:
#    bias_scan__params: dict [Default: {'scoring': 'Bernoulli', 'penalty': 0.5}]
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
# Outputs:
#    output: system.HTML
components:
  comp-bias-scan:
    executorLabel: exec-bias-scan
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        bias_scan__params:
          defaultValue:
            penalty: 0.5
            scoring: Bernoulli
          isOptional: true
          parameterType: STRUCT
        sensitive:
          parameterType: LIST
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-bias-scan:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - bias_scan
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth-commons[deployment]'\
          \ 'aif360' 'pandas' 'onnxruntime' 'ucimlrepo' 'pygrank' && \"$0\" \"$@\"\
          \n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/bias_scan:v0038
pipelineInfo:
  name: bias-scan
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: bias-scan
    tasks:
      bias-scan:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-bias-scan
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            bias_scan__params:
              componentInputParameter: bias_scan__params
            sensitive:
              componentInputParameter: sensitive
        taskInfo:
          name: bias-scan
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      bias_scan__params:
        defaultValue:
          penalty: 0.5
          scoring: Bernoulli
        isOptional: true
        parameterType: STRUCT
      sensitive:
        parameterType: LIST
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.12.1
