# PIPELINE DEFINITION
# Name: augmentation-report
# Inputs:
#    augmentation_report__params: dict [Default: {}]
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
# Outputs:
#    output: system.HTML
components:
  comp-augmentation-report:
    executorLabel: exec-augmentation-report
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        augmentation_report__params:
          defaultValue: {}
          isOptional: true
          parameterType: STRUCT
        sensitive:
          parameterType: LIST
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-augmentation-report:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - augmentation_report
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'fairbench' 'pandas' 'plotly' 'ucimlrepo' 'pygrank' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/augmentation_report:v0044
pipelineInfo:
  name: augmentation-report
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: augmentation-report
    tasks:
      augmentation-report:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-augmentation-report
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            augmentation_report__params:
              componentInputParameter: augmentation_report__params
            sensitive:
              componentInputParameter: sensitive
        taskInfo:
          name: augmentation-report
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      augmentation_report__params:
        defaultValue: {}
        isOptional: true
        parameterType: STRUCT
      sensitive:
        parameterType: LIST
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
