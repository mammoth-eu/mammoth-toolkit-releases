# PIPELINE DEFINITION
# Name: data-graph-csv
# Inputs:
#    data_graph_csv__params: dict [Default: {'attributes': '', 'path_edges': '', 'path_nodes': ''}]
# Outputs:
#    output: system.Dataset
components:
  comp-data-graph-csv:
    executorLabel: exec-data-graph-csv
    inputDefinitions:
      parameters:
        data_graph_csv__params:
          defaultValue:
            attributes: ''
            path_edges: ''
            path_nodes: ''
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-graph-csv:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_graph_csv
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth-commons[deployment]==0.0.38'\
          \ 'pandas' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/data_graph_csv:v0036
pipelineInfo:
  name: data-graph-csv
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: data-graph-csv
    tasks:
      data-graph-csv:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-graph-csv
        inputs:
          parameters:
            data_graph_csv__params:
              componentInputParameter: data_graph_csv__params
        taskInfo:
          name: data-graph-csv
  inputDefinitions:
    parameters:
      data_graph_csv__params:
        defaultValue:
          attributes: ''
          path_edges: ''
          path_nodes: ''
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
