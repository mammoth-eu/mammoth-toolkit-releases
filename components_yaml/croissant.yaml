# PIPELINE DEFINITION
# Name: croissant
# Inputs:
#    croissant__params: dict [Default: {'license': '', 'name': '', 'citation': '', 'language': 'en', 'qualitative_creators': '', 'description': ''}]
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
# Outputs:
#    output: system.HTML
components:
  comp-croissant:
    executorLabel: exec-croissant
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        croissant__params:
          defaultValue:
            citation: ''
            description: ''
            language: en
            license: ''
            name: ''
            qualitative_creators: ''
          isOptional: true
          parameterType: STRUCT
        sensitive:
          parameterType: LIST
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-croissant:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - croissant
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'fairbench' 'pandas' 'onnxruntime' 'ucimlrepo' 'pygrank' && \"$0\" \"\
          $@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/croissant:v0049
pipelineInfo:
  name: croissant
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: croissant
    tasks:
      croissant:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-croissant
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            croissant__params:
              componentInputParameter: croissant__params
            sensitive:
              componentInputParameter: sensitive
        taskInfo:
          name: croissant
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      croissant__params:
        defaultValue:
          citation: ''
          description: ''
          language: en
          license: ''
          name: ''
          qualitative_creators: ''
        isOptional: true
        parameterType: STRUCT
      sensitive:
        parameterType: LIST
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
