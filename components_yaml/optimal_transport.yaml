# PIPELINE DEFINITION
# Name: optimal-transport
# Inputs:
#    dataset: system.Dataset
#    model: system.Model
#    optimal_transport__params: dict [Default: {'threshold': 0.01}]
#    sensitive: list
# Outputs:
#    output: system.HTML
components:
  comp-optimal-transport:
    executorLabel: exec-optimal-transport
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        optimal_transport__params:
          defaultValue:
            threshold: 0.01
          isOptional: true
          parameterType: STRUCT
        sensitive:
          parameterType: LIST
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-optimal-transport:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - optimal_transport
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'aif360' 'aif360[OptimalTransport]' 'pandas' 'onnxruntime' 'ucimlrepo'\
          \ 'pygrank' 'scikit-image' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/optimal_transport:v0043
pipelineInfo:
  name: optimal-transport
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: optimal-transport
    tasks:
      optimal-transport:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-optimal-transport
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            optimal_transport__params:
              componentInputParameter: optimal_transport__params
            sensitive:
              componentInputParameter: sensitive
        taskInfo:
          name: optimal-transport
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      optimal_transport__params:
        defaultValue:
          threshold: 0.01
        isOptional: true
        parameterType: STRUCT
      sensitive:
        parameterType: LIST
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
