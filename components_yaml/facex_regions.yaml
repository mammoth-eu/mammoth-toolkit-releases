# PIPELINE DEFINITION
# Name: facex-regions
# Inputs:
#    dataset: system.Dataset
#    facex_regions__params: dict [Default: {'target_layer': 'None', 'target_class': 1.0}]
#    model: system.Model
#    sensitive: list
# Outputs:
#    output: system.HTML
components:
  comp-facex-regions:
    executorLabel: exec-facex-regions
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        facex_regions__params:
          defaultValue:
            target_class: 1.0
            target_layer: None
          isOptional: true
          parameterType: STRUCT
        sensitive:
          parameterType: LIST
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-facex-regions:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - facex_regions
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'torch' 'torchvision' 'timm' 'facextool' 'numpy>=2.0.0' && \"$0\" \"$@\"\
          \n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/facex_regions:v0049
pipelineInfo:
  name: facex-regions
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: facex-regions
    tasks:
      facex-regions:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-facex-regions
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            facex_regions__params:
              componentInputParameter: facex_regions__params
            sensitive:
              componentInputParameter: sensitive
        taskInfo:
          name: facex-regions
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      facex_regions__params:
        defaultValue:
          target_class: 1.0
          target_layer: None
        isOptional: true
        parameterType: STRUCT
      sensitive:
        parameterType: LIST
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
