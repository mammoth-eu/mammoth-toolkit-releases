# PIPELINE DEFINITION
# Name: model-manual-predictor
# Inputs:
#    model_manual_predictor__params: dict [Default: {'path_or_predictions': ''}]
# Outputs:
#    output: system.Model
components:
  comp-model-manual-predictor:
    executorLabel: exec-model-manual-predictor
    inputDefinitions:
      parameters:
        model_manual_predictor__params:
          defaultValue:
            path_or_predictions: ''
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-model-manual-predictor:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_manual_predictor
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'pandas' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/model_manual_predictor:v0049
pipelineInfo:
  name: model-manual-predictor
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: model-manual-predictor
    tasks:
      model-manual-predictor:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-manual-predictor
        inputs:
          parameters:
            model_manual_predictor__params:
              componentInputParameter: model_manual_predictor__params
        taskInfo:
          name: model-manual-predictor
  inputDefinitions:
    parameters:
      model_manual_predictor__params:
        defaultValue:
          path_or_predictions: ''
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
