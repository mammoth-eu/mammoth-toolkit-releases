# PIPELINE DEFINITION
# Name: data-uci
# Inputs:
#    data_uci__params: dict [Default: {'target': 'None', 'dataset_name': 'None'}]
# Outputs:
#    output: system.Dataset
components:
  comp-data-uci:
    executorLabel: exec-data-uci
    inputDefinitions:
      parameters:
        data_uci__params:
          defaultValue:
            dataset_name: None
            target: None
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-uci:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_uci
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'pandas' 'ucimlrepo' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/data_uci:v0042
pipelineInfo:
  name: data-uci
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: data-uci
    tasks:
      data-uci:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-uci
        inputs:
          parameters:
            data_uci__params:
              componentInputParameter: data_uci__params
        taskInfo:
          name: data-uci
  inputDefinitions:
    parameters:
      data_uci__params:
        defaultValue:
          dataset_name: None
          target: None
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.12.2
