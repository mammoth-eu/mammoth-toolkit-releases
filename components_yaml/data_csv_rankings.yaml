# PIPELINE DEFINITION
# Name: data-csv-rankings
# Inputs:
#    data_csv_rankings__params: dict [Default: {'path': '', 'delimiter': '|'}]
# Outputs:
#    output: system.Dataset
components:
  comp-data-csv-rankings:
    executorLabel: exec-data-csv-rankings
    inputDefinitions:
      parameters:
        data_csv_rankings__params:
          defaultValue:
            delimiter: '|'
            path: ''
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-csv-rankings:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_csv_rankings
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/data_csv_rankings:v0048
pipelineInfo:
  name: data-csv-rankings
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: data-csv-rankings
    tasks:
      data-csv-rankings:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-csv-rankings
        inputs:
          parameters:
            data_csv_rankings__params:
              componentInputParameter: data_csv_rankings__params
        taskInfo:
          name: data-csv-rankings
  inputDefinitions:
    parameters:
      data_csv_rankings__params:
        defaultValue:
          delimiter: '|'
          path: ''
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
