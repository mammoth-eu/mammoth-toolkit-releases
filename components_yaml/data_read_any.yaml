# PIPELINE DEFINITION
# Name: data-read-any
# Inputs:
#    data_read_any__params: dict [Default: {'dataset_path': 'None', 'target': 'None'}]
# Outputs:
#    output: system.Dataset
components:
  comp-data-read-any:
    executorLabel: exec-data-read-any
    inputDefinitions:
      parameters:
        data_read_any__params:
          defaultValue:
            dataset_path: None
            target: None
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-read-any:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_read_any
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'pandas' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/data_read_any:v0049
pipelineInfo:
  name: data-read-any
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: data-read-any
    tasks:
      data-read-any:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-read-any
        inputs:
          parameters:
            data_read_any__params:
              componentInputParameter: data_read_any__params
        taskInfo:
          name: data-read-any
  inputDefinitions:
    parameters:
      data_read_any__params:
        defaultValue:
          dataset_path: None
          target: None
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
