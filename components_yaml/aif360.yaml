# PIPELINE DEFINITION
# Name: aif360
# Inputs:
#    aif360__params: dict [Default: {'favorable_label': 1.0, 'unfavorable_label': 0.0}]
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
# Outputs:
#    output: system.HTML
components:
  comp-aif360:
    executorLabel: exec-aif360
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        aif360__params:
          defaultValue:
            favorable_label: 1.0
            unfavorable_label: 0.0
          isOptional: true
          parameterType: STRUCT
        sensitive:
          parameterType: LIST
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-aif360:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - aif360
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'aif360' 'pandas' 'scikit-learn' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/aif360:v0050
pipelineInfo:
  name: aif360
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: aif360
    tasks:
      aif360:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-aif360
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            aif360__params:
              componentInputParameter: aif360__params
            sensitive:
              componentInputParameter: sensitive
        taskInfo:
          name: aif360
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      aif360__params:
        defaultValue:
          favorable_label: 1.0
          unfavorable_label: 0.0
        isOptional: true
        parameterType: STRUCT
      sensitive:
        parameterType: LIST
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
