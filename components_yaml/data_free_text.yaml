# PIPELINE DEFINITION
# Name: data-free-text
# Inputs:
#    data_free_text__params: dict [Default: {'text': ''}]
# Outputs:
#    output: system.Dataset
components:
  comp-data-free-text:
    executorLabel: exec-data-free-text
    inputDefinitions:
      parameters:
        data_free_text__params:
          defaultValue:
            text: ''
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-free-text:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_free_text
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'bs4' 'requests' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/data_free_text:v0048
pipelineInfo:
  name: data-free-text
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: data-free-text
    tasks:
      data-free-text:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-free-text
        inputs:
          parameters:
            data_free_text__params:
              componentInputParameter: data_free_text__params
        taskInfo:
          name: data-free-text
  inputDefinitions:
    parameters:
      data_free_text__params:
        defaultValue:
          text: ''
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
