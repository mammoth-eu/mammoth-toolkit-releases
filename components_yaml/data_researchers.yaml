# PIPELINE DEFINITION
# Name: data-researchers
# Inputs:
#    data_researchers__params: dict [Default: {'paper_affiliations_path': '', 'paper_graph_path': '', 'paper_affiliation_delimiter': '|', 'paper_graph_delimiter': '|'}]
# Outputs:
#    output: system.Dataset
components:
  comp-data-researchers:
    executorLabel: exec-data-researchers
    inputDefinitions:
      parameters:
        data_researchers__params:
          defaultValue:
            paper_affiliation_delimiter: '|'
            paper_affiliations_path: ''
            paper_graph_delimiter: '|'
            paper_graph_path: ''
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-researchers:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_researchers
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth-commons[deployment]'\
          \ 'pandas' 'networkx' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/data_researchers:v0038
pipelineInfo:
  name: data-researchers
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: data-researchers
    tasks:
      data-researchers:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-researchers
        inputs:
          parameters:
            data_researchers__params:
              componentInputParameter: data_researchers__params
        taskInfo:
          name: data-researchers
  inputDefinitions:
    parameters:
      data_researchers__params:
        defaultValue:
          paper_affiliation_delimiter: '|'
          paper_affiliations_path: ''
          paper_graph_delimiter: '|'
          paper_graph_path: ''
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.12.1
