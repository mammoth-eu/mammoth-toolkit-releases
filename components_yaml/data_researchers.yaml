components:
  comp-data-researchers:
    executorLabel: exec-data-researchers
    inputDefinitions:
      parameters:
        data_researchers__params:
          defaultValue:
            country_codes_path: https://raw.githubusercontent.com/mammoth-eu/mammoth-commons/refs/heads/dev/data/researchers/Country_codes.csv
            country_divisions_path: https://raw.githubusercontent.com/mammoth-eu/mammoth-commons/refs/heads/dev/data/researchers/API_NY.GDP.MKTP.CD_DS2_en_csv_v2_14/Metadata_Country_API_NY.GDP.MKTP.CD_DS2_en_csv_v2_14.csv
            paper_affiliation_delimiter: '|'
            paper_affiliations_path: ''
            paper_graph_delimiter: '|'
            paper_graph_path: ''
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-researchers:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_researchers
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'pandas' 'networkx' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/data_researchers:v0043
pipelineInfo:
  name: data-researchers
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: data-researchers
    tasks:
      data-researchers:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-researchers
        inputs:
          parameters:
            data_researchers__params:
              componentInputParameter: data_researchers__params
        taskInfo:
          name: data-researchers
  inputDefinitions:
