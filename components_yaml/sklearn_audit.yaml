# PIPELINE DEFINITION
# Name: sklearn-audit
# Inputs:
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
#    sklearn_audit__params: dict [Default: {'predictor': 'None', 'problematic_deviation': 0.1, 'top_recommendations': 3.0, 'compare_groups': 'None', 'show_non_problematic': False, 'intersectional': False}]
# Outputs:
#    output: system.HTML
components:
  comp-sklearn-audit:
    executorLabel: exec-sklearn-audit
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        sensitive:
          parameterType: LIST
        sklearn_audit__params:
          defaultValue:
            compare_groups: None
            intersectional: false
            predictor: None
            problematic_deviation: 0.1
            show_non_problematic: false
            top_recommendations: 3.0
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-sklearn-audit:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - sklearn_audit
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'fairbench' 'scikit-learn' 'pandas' 'onnxruntime' 'ucimlrepo' 'pygrank'\
          \ && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/sklearn_audit:v0042
pipelineInfo:
  name: sklearn-audit
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: sklearn-audit
    tasks:
      sklearn-audit:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-sklearn-audit
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            sensitive:
              componentInputParameter: sensitive
            sklearn_audit__params:
              componentInputParameter: sklearn_audit__params
        taskInfo:
          name: sklearn-audit
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      sensitive:
        parameterType: LIST
      sklearn_audit__params:
        defaultValue:
          compare_groups: None
          intersectional: false
          predictor: None
          problematic_deviation: 0.1
          show_non_problematic: false
          top_recommendations: 3.0
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
