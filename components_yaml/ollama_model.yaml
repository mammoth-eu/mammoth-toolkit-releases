# PIPELINE DEFINITION
# Name: ollama-model
# Inputs:
#    ollama_model__params: dict [Default: {'url': 'http://localhost:11434', 'name': 'llama3.2:latest'}]
# Outputs:
#    output: system.Model
components:
  comp-ollama-model:
    executorLabel: exec-ollama-model
    inputDefinitions:
      parameters:
        ollama_model__params:
          defaultValue:
            name: llama3.2:latest
            url: http://localhost:11434
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-ollama-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ollama_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/ollama_model:v0049
pipelineInfo:
  name: ollama-model
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: ollama-model
    tasks:
      ollama-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ollama-model
        inputs:
          parameters:
            ollama_model__params:
              componentInputParameter: ollama_model__params
        taskInfo:
          name: ollama-model
  inputDefinitions:
    parameters:
      ollama_model__params:
        defaultValue:
          name: llama3.2:latest
          url: http://localhost:11434
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
