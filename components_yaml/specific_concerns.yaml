# PIPELINE DEFINITION
# Name: specific-concerns
# Inputs:
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
#    specific_concerns__params: dict [Default: {'problematic_deviation': 0.1, 'intersections': 'Base', 'compare_groups': 'None', 'reduction': 'None', 'base_measure': 'None'}]
# Outputs:
#    output: system.HTML
components:
  comp-specific-concerns:
    executorLabel: exec-specific-concerns
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        sensitive:
          parameterType: LIST
        specific_concerns__params:
          defaultValue:
            base_measure: None
            compare_groups: None
            intersections: Base
            problematic_deviation: 0.1
            reduction: None
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-specific-concerns:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - specific_concerns
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'fairbench' 'pandas' 'onnxruntime' 'ucimlrepo' 'pygrank' && \"$0\" \"\
          $@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/specific_concerns:v0044
pipelineInfo:
  name: specific-concerns
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: specific-concerns
    tasks:
      specific-concerns:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-specific-concerns
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            sensitive:
              componentInputParameter: sensitive
            specific_concerns__params:
              componentInputParameter: specific_concerns__params
        taskInfo:
          name: specific-concerns
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      sensitive:
        parameterType: LIST
      specific_concerns__params:
        defaultValue:
          base_measure: None
          compare_groups: None
          intersections: Base
          problematic_deviation: 0.1
          reduction: None
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
