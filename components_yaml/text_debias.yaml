# PIPELINE DEFINITION
# Name: text-debias
# Inputs:
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
#    text_debias__params: dict [Default: {}]
# Outputs:
#    output: system.HTML
components:
  comp-text-debias:
    executorLabel: exec-text-debias
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        sensitive:
          parameterType: LIST
        text_debias__params:
          defaultValue: {}
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-text-debias:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - text_debias
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'dbias --no-deps --upgrade' 'protobuf==4.25.8' 'tensorflow' 'transformers'\
          \ 'tf-keras' 'catalogue==2.0.6' 'spacy==3.2.0' 'plotly' 'torch' 'pandas'\
          \ 'spacy-transformers' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/text_debias:v0049
pipelineInfo:
  name: text-debias
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: text-debias
    tasks:
      text-debias:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-text-debias
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            sensitive:
              componentInputParameter: sensitive
            text_debias__params:
              componentInputParameter: text_debias__params
        taskInfo:
          name: text-debias
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      sensitive:
        parameterType: LIST
      text_debias__params:
        defaultValue: {}
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
