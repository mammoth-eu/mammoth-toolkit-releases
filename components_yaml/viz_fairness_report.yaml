# PIPELINE DEFINITION
# Name: viz-fairness-report
# Inputs:
#    dataset: system.Dataset
#    model: system.Model
#    sensitive: list
#    viz_fairness_report__params: dict [Default: {}]
# Outputs:
#    output: system.HTML
components:
  comp-viz-fairness-report:
    executorLabel: exec-viz-fairness-report
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        sensitive:
          parameterType: LIST
        viz_fairness_report__params:
          defaultValue: {}
          isOptional: true
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-viz-fairness-report:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - viz_fairness_report
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'fairlearn' 'plotly' 'pandas' 'onnxruntime' 'mmm-fair-cli' 'skl2onnx>=1.19.1'\
          \ && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/viz_fairness_report:v0044
pipelineInfo:
  name: viz-fairness-report
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: viz-fairness-report
    tasks:
      viz-fairness-report:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-viz-fairness-report
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            sensitive:
              componentInputParameter: sensitive
            viz_fairness_report__params:
              componentInputParameter: viz_fairness_report__params
        taskInfo:
          name: viz-fairness-report
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      sensitive:
        parameterType: LIST
      viz_fairness_report__params:
        defaultValue: {}
        isOptional: true
        parameterType: STRUCT
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
