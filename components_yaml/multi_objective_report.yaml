# PIPELINE DEFINITION
# Name: multi-objective-report
# Inputs:
#    dataset: system.Dataset
#    model: system.Model
#    multi_objective_report__params: dict [Default: {}]
#    sensitive: list
# Outputs:
#    output: system.HTML
components:
  comp-multi-objective-report:
    executorLabel: exec-multi-objective-report
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        multi_objective_report__params:
          defaultValue: {}
          isOptional: true
          parameterType: STRUCT
        sensitive:
          parameterType: LIST
    outputDefinitions:
      artifacts:
        output:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-multi-objective-report:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - multi_objective_report
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mammoth_commons[deployment]'\
          \ 'fairbench' 'plotly' 'pandas' 'onnxruntime' 'ucimlrepo' 'pygrank' 'mmm-fair-cli'\
          \ 'skl2onnx>=1.19.1' && \"$0\" \"$@\"\n"
        - python3
        - -m
        - kfp.dsl.executor_main
        image: mammotheu/multi_objective_report:v0044
pipelineInfo:
  name: multi-objective-report
root:
  dag:
    outputs:
      artifacts:
        output:
          artifactSelectors:
          - outputArtifactKey: output
            producerSubtask: multi-objective-report
    tasks:
      multi-objective-report:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-multi-objective-report
        inputs:
          artifacts:
            dataset:
              componentInputArtifact: dataset
            model:
              componentInputArtifact: model
          parameters:
            multi_objective_report__params:
              componentInputParameter: multi_objective_report__params
            sensitive:
              componentInputParameter: sensitive
        taskInfo:
          name: multi-objective-report
  inputDefinitions:
    artifacts:
      dataset:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
      model:
        artifactType:
          schemaTitle: system.Model
          schemaVersion: 0.0.1
    parameters:
      multi_objective_report__params:
        defaultValue: {}
        isOptional: true
        parameterType: STRUCT
      sensitive:
        parameterType: LIST
  outputDefinitions:
    artifacts:
      output:
        artifactType:
          schemaTitle: system.HTML
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
