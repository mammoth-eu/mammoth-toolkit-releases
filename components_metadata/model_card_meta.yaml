id: model_card
name: model card
description: "\n    <p>Generates a fairness and bias report using the <a href=\"https://github.com/mever-team/FairBench\"\
  >FairBench</a>\n    library. This explores many kinds of bias to paint a broad picture\
  \ and help you decide on what is problematic\n    and what is acceptable behavior.\n\
  \    The generated report can be viewed in three different formats, where the model\
  \ card contains a subset of\n    results but attaches to these socio-technical concerns\
  \ to be taken into account:</p>\n    <ol>\n        <li>A summary table of results.</li>\n\
  \        <li>A simplified model card that includes concerns.</li>\n        <li>The\
  \ full report, including details.</li>\n    </ol>\n\n    <p>The module's report\
  \ summarizes how a model behaves on a provided dataset across different population\
  \ groups.\n    These groups are based on sensitive attributes like gender, age,\
  \ and race. Each attribute can have multiple values,\n    such as several genders\
  \ or races. Numeric attributes, like age, are normalized to the range [0,1] and\
  \ treated\n    as fuzzy values, where 0 indicates membership to a fuzzy group of\
  \ \"small\" values, and 1 indicates membership to\n    a fuzzy group of \"large\"\
  \ values. A separate set of fairness metrics is calculated for each prediction label.</p>\n\
  \n    <p>If intersectional subgroup analysis is enabled, separate subgroups are\
  \ created for each combination of sensitive\n    attribute values. However, if there\
  \ are too many attributes, some groups will be small or empty. Empty groups are\n\
  \    ignored in the analysis. The report may also include information about built-in\
  \ datasets.</p>\n\n    Args:\n        intersectional: Whether to consider all non-empty\
  \ group intersections during analysis. This does nothing if there is only one sensitive\
  \ attribute. It could be computationally intensive if too many group intersections\
  \ are selected.\n        compare_groups: Whether to compare groups pairwise, or\
  \ each group to the behavior of the whole population.\n        minimum_shown_deviation:\
  \ Show only results where the deviation from ideal values exceeds the given threshold.\
  \ If nothing is shown, fairness is not necessarily achieved, but this is a good\
  \ way to identify the most prominent biases. If value of 0 is set, all report values\
  \ are shown, including those that have no set ideal value.\n    \n    Options:\n\
  \        compare_groups: Pairwise, To the total population"
parameter_info: Some parameters are needed.
component_type: METRIC
input_types:
- Dataset
- Predictor
parameter_default:
  intersectional: false
  compare_groups: None
  minimum_shown_deviation: 0.1
output_types: []
