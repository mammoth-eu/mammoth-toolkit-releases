id: model_mitigation_ranking
name: model mitigation ranking
description: "\nLoad the researcher ranking model incorporating a mitigation strategy.\n\
  \nThis function implements a fair ranking mechanism utilizing a sampling technique.\
  \ It applies a\nmitigation strategy based on Statistical Parity, which aims to ensure\
  \ equitable treatment\nacross different groups by mitigating bias in the ranking\
  \ process. Additionally, it compares\nthe results of this fair ranking with a standard\
  \ ranking derived from one of the numerical columns.\n\nReturns:\n    ResearcherRanking:\
  \ An instance of ResearcherRanking that contains both the mitigation-based\n   \
  \ ranking and the standard ranking for comparison.\n"
parameter_info: No parameters needed.
component_type: LOADER_MODEL
parameter_default: {}
output_types:
- ResearcherRanking
- Model
