id: model_manual_predictor
name: model manual predictor
description: "Lets you input comma-separated list of predictions that correspond to\
  \ the data you are processing.\nThis is useful so that you can export the predictions\
  \ directly from your testing code. If there are no\ncommas provided, this module's\
  \ argument is considered to be the URL to a CSV file whose last column contains\n\
  the predictions. Other columns are ignored, but are allowed to give you flexibility.\
  \ If your dataset also\nhas the last column as the prediction label (e.g., if it\
  \ is loaded with auto csv) you will obtain analysis\nfor a perfect predictor.\n\n\
  Args:\n        path_or_predictions: A comma-separated list of predictions, or a\
  \ URL to a CSV file whose last column contains them.\n"
parameter_info: Some parameters are needed.
component_type: LOADER_MODEL
parameter_default:
  path_or_predictions: ''
output_types:
- Predictor
- ManualPredictor
