id: text_debias
name: text debias
description: '

  <p>

  This module uses <a href="https://github.com/dreji18/Fairness-in-AI">DBias</a> library
  to perform

  unsupervised auditing of text biases in text resembling article titles. If library
  identifies biases, it is used to

  mitigate them with a more neutral phrasing. Results show a judgement and prediction
  confidence for the original

  and adjusted text, as well as potentially offending keywords.

  </p>


  <p>

  The DBias library employs three transformer models,

  one pretrained for the English language and two trained

  on the <a href="https://github.com/Media-Bias-Group/Neural-Media-Bias-Detection-Using-Distant-Supervision-With-BABE">MBIC
  dataset</a>.

  </p>

  '
parameter_info: No parameters needed.
component_type: METRIC
input_types:
- Text
- EmptyModel
parameter_default: {}
output_types: []
