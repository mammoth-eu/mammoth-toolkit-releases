id: multi_objective_report
name: multi objective report
description: "<p>This module presents an interactive <a href=\"https://plotly.com/python/3d-charts/\"\
  \ target=\"_blank\">Plotly 3D plot</a>\n    visualizing multiple objectives to evaluate\
  \ model fairness and performance trade-offs. The report highlights three\n    primary\
  \ objectives: <b>accuracy loss</b>, <b>balanced accuracy loss</b>, and <b>discrimination\
  \ (MMM-fairness)\n    loss</b>. Each point plotted within the 3D space represents\
  \ a <i>Pareto-optimal</i> solution, which achieves an\n    optimal balance between\
  \ these objectives where no single objective can improve without worsening another.</p>\n\
  \n    <p>Users can hover over any solution point to display the corresponding loss\
  \ values for each objective.\n    Additionally, each point includes a <b>theta</b>\
  \ value, indicating up to which sequence in the ONNX\n    ensemble the particular\
  \ solution is achieved. This allows users to observe performance changes throughout\n\
  \    different stages of the ensemble, helping them better understand the trade-offs\
  \ involved in each model\n    configuration.</p>\n\n\n\n    <span class=\"alert\
  \ alert-warning alert-dismissible fade show\" role=\"alert\"\n    style=\"display:\
  \ inline-block; padding: 10px;\"> <i class=\"bi bi-exclamation-triangle-fill\"></i>\
  \ The multi-objective\n    report generates predictions at each step of the partial\
  \ ensemble. This may result in slower processing\n    times when the number of Pareto\
  \ solutions is high.</span>\n    "
parameter_info: No parameters needed.
component_type: METRIC
input_types:
- CSV
- ONNXEnsemble
parameter_default: {}
output_types: []
