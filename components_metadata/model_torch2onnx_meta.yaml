id: model_torch2onnx
name: model torch2onnx
description: "\n\n<img src=\"https://github.com/pytorch/pytorch/raw/main/docs/source/_static/img/pytorch-logo-dark.png\"\
  \ alt=\"Based on PyTorch\" style=\"float: left; margin-right: 5px; margin-bottom:\
  \ 5px; margin-top: 10px; height: 30px;\"/>\n\nLoads a <a href=\"https://pytorch.org/\"\
  >pytorch</a> model that comprises a Python code initializing the\narchitecture and\
  \ a file of trained parameters, and converts into ONNX format to support processing\
  \ by\nmodules not supporting GPU compute. For safety, the architecture's\ndefinition\
  \ is allowed to directly import only specified libraries.\n\nArgs:\n    state_path:\
  \ The path in which the architecture's state is stored.\n    model_path: The path\
  \ in which the architecture's initialization script resides. Alternatively, you\
  \ may also just paste the initialization code in this field.\n    model_name: The\
  \ variable in the model path's script to which the architecture is assigned.\n \
  \   input_width: The expected width of input images.\n    input_height: The expected\
  \ heightg of input images.\n    safe_libraries: A comma-separated list of libraries\
  \ that can be imported.\n    multiclass_threshold: A decision threshold that treats\
  \ outputs as separate classes. If this is set to zero (default), a softmax is applied\
  \ to outputs. For binary classification, this is equivalent to setting the decision\
  \ threshold at 0.5. Otherwise, each output is thresholded separately.\n"
parameter_info: Some parameters are needed.
component_type: LOADER_MODEL
parameter_default:
  state_path: ''
  model_path: ''
  model_name: model
  input_width: 224
  input_height: 224
  safe_libraries: numpy, torch, torchvision, PIL, io, requests
  multiclass_threshold: 0
output_types:
- Predictor
- ONNX
