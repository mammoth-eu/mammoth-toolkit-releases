id: data_auto_csv
name: data auto csv
description: "\n<img src=\"https://pandas.pydata.org/static/img/pandas_white.svg\"\
  \ alt=\"Based on Pandas\" style=\"background-color: #000099; float: left; margin-right:\
  \ 15px; margin-top: 5px; margin-bottom: 5px; height: 60px;\"/>\n\nLoads a CSV file\
  \ that contains numeric, categorical, and predictive data columns.\nThis automatically\
  \ detects the characteristics of the dataset being loaded,\nnamely the delimiter\
  \ that separates the columns, and whether each column contains\nnumeric or categorical\
  \ data. A <a href=\"https://pandas.pydata.org/\">pandas</a>\nCSV reader is employed\
  \ internally.\nThe last categorical column is used as the dataset label. To load\
  \ the file using\ndifferent options (e.g., a subset of columns, a different label\
  \ column) use the\ncustom csv loader instead.\n\nIf you want to train a model while\
  \ using the same loading mechanism as this dataset,\nrun the following Python script.\
  \ This uses supporting methods from the lightweight\nmammoth-commons core to retrieve\
  \ <a href=\"https://numpy.org/\">numpy</a>\narrays *X,y* of dataset features and\
  \ of categorical labels respectively.\n\n<small>\n<pre>\n% pip install --upgrade\
  \ pandas\n% pip install --upgrade mammoth_commons\nimport pandas as pd\nfrom mammoth_commons.externals\
  \ import pd_read_csv\nfrom mammoth_commons.datasets import CSV\n\n# set parameters\
  \ and load data (modify max_discrete as needed)\npath = ...\nmax_discrete = 10\n\
  df = pd_read_csv(path, on_bad_lines=\"skip\")\n\n# identify numeric and categorical\
  \ columns\nnum = [col for col in df if pd.api.types.is_any_real_numeric_dtype(df[col])]\n\
  num = [col for col in num if len(set(df[col])) > max_discrete]\nnum_set = set(num)\n\
  cat = [col for col in df if col not in num_set]\n\n# convert to numpy data\ncsv_dataset\
  \ = CSV(df, num=num, cat=cat[:-1], labels=cat[-1])\nX = X.astype(np.float32)\ny\
  \ = df[cat[-1]]\n</pre>\n</small>\n\n\nArgs:\n    path: The local file path or a\
  \ web URL of the file.\n    max_discrete: If a numeric column has a number of discrete\
  \ entries than is less than this number (e.g., if it contains binary numeric values)\
  \ then it is considered to hold categorical instead of numeric data. Minimum accepted\
  \ value is 2.\n"
parameter_info: Some parameters are needed.
component_type: LOADER_DATA
parameter_default:
  path: ''
  max_discrete: 10
output_types:
- CSV
- Dataset
