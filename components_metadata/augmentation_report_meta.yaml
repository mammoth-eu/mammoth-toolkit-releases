id: augmentation_report
name: augmentation report
description: "\n    This module generates an interactive HTML report featuring a\n\
  \    <a href=\"https://plotly.com/python/sunburst-charts/\" target=\"_blank\">Plotly\
  \ sunburst pie chart</a> visualization\n    to explore imbalances in the dataset\
  \ based on subgroups defined by sensitive attributes and the target variable.\n\
  \    This helps to quickly identify any potential imbalances in the dataset, allowing\
  \ users to assess fairness and\n    identify areas that may require intervention,\
  \ such augmentation.\n\n    Furthermore, the report visually presents different\
  \ augmentation strategies designed to mitigate data imbalances,\n    per sensitive\
  \ attribute, as an interactive <a href=\"https://plotly.com/python/bar-charts/.\"\
  \ target=\"_blank\">Plotly bar chart</a>.\n    These strategies adjust the distribution\
  \ of the dataset by oversampling specific subgroups with synthetic samples,\n  \
  \  ensuring more equitable representation of sensitive attributes and target classes.\
  \ The following\n    augmentation strategies are visualized:\n\n    - **Class:**\
  \ Balances the class distribution within each subgroup by sampling the minority\
  \ class.\n    - **Class & Protected:** Ensures equal sample distribution across\
  \ all subgroups by sampling both majority\n      and minority classes.\n    - **Protected:**\
  \ Balances the number of instances across different groups without considering class\
  \ labels.\n    - **Class (Ratio):** Maintains the same class ratio across all groups\
  \ as found in the largest group.\n\n    These visualizations allow users to observe\
  \ the effects of each strategy on the data distribution, helping to\n    understand\
  \ how the dataset is being augmented.\n\n    For more information, refer to our\
  \ full paper:\n    **\"Synthetic Tabular Data Generation for Class Imbalance and\
  \ Fairness: A Comparative Study\"**\n    [Link to paper](https://arxiv.org/pdf/2409.05215).\n\
  \    "
parameter_info: No parameters needed.
component_type: METRIC
input_types:
- CSV
- EmptyModel
parameter_default: {}
output_types: []
