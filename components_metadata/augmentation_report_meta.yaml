id: augmentation_report
name: augmentation report
description: "\nThis module generates an interactive HTML report featuring a\n<a href=\"\
  https://plotly.com/python/sunburst-charts/\" target=\"_blank\">Plotly sunburst pie\
  \ chart</a> visualization\nto explore imbalances in the dataset based on subgroups\
  \ defined by sensitive attributes and the target variable.\nThis helps to quickly\
  \ identify any potential imbalances in the dataset, allowing users to assess fairness\
  \ and\nidentify areas that may require intervention, such augmentation.\n\nFurthermore,\
  \ the report visually presents different augmentation strategies designed to mitigate\
  \ data imbalances,\nper sensitive attribute, as an interactive <a href=\"https://plotly.com/python/bar-charts/.\"\
  \ target=\"_blank\">Plotly bar chart</a>.\nThese strategies adjust the distribution\
  \ of the dataset by oversampling specific subgroups with synthetic samples,\nensuring\
  \ more equitable representation of sensitive attributes and target classes. The\
  \ following\naugmentation strategies are visualized:\n\n- **Class:** Balances the\
  \ class distribution within each subgroup by sampling the minority class.\n- **Class\
  \ & Protected:** Ensures equal sample distribution across all subgroups by sampling\
  \ both majority\n  and minority classes.\n- **Protected:** Balances the number of\
  \ instances across different groups without considering class labels.\n- **Class\
  \ (Ratio):** Maintains the same class ratio across all groups as found in the largest\
  \ group.\n\nThese visualizations allow users to observe the effects of each strategy\
  \ on the data distribution, helping to\nunderstand how the dataset is being augmented.\n\
  \nFor more information, refer to our full paper:\n**\"Synthetic Tabular Data Generation\
  \ for Class Imbalance and Fairness: A Comparative Study\"**\n[Link to paper](https://arxiv.org/pdf/2409.05215).\n"
parameter_info: No parameters needed.
component_type: METRIC
input_types:
- Dataset
- EmptyModel
parameter_default: {}
output_types: []
