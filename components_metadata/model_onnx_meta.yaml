id: model_onnx
name: model onnx
description: "\n<img src=\"https://onnx.ai/images/ONNX-Logo.svg\" alt=\"Based on ONNX\"\
  \ style=\"background-color: #000055; float: left; margin-right: 15px; margin-top:\
  \ 5px; margin-bottom: 5px; height: 40px;\"/>\n\nLoads an inference model stored\
  \ in <a href=\"https://onnx.ai/\">ONNx</a> format.\nThis is a generic cross-platform\
  \ format for representing machine learning models with a common set of operations.\n\
  Several machine learning frameworks can export to this format.\nThe loaded model\
  \ should be compatible with the dataset being analysed. For example,\nthe same data\
  \ columns as in the dataset should be used for training on tabular data.\n\nONNx\
  \ supports several different runtimes, but this loader's implementation selects\n\
  the `CPUExecutionProvider` runtime to run on, therefore maintaining compatibility\n\
  with most machines.\nFor inference in GPUs, prefer storing and loading models in\
  \ formats\nthat are guaranteed to maintain all features that could be included in\
  \ the architectures\nof respective frameworks; this can be achieved with different\
  \ model loaders.\n\nHere are some quick links on how to export ONNx models from\
  \ popular frameworks:\n<ul>\n<li><a href=\"https://onnx.ai/sklearn-onnx\">scikit-learn</a></li>\n\
  <li><a href=\"https://pytorch.org/tutorials/beginner/onnx/export_simple_model_to_onnx_tutorial.html\"\
  >PyTorch</a></li>\n<li><a href=\"https://onnxruntime.ai/docs/tutorials/tf-get-started.html\"\
  >TensorFlow</a></li>\n</ul>\n\nArgs:\n    path: A local path or url pointing to\
  \ the ONNX file. The loader checks for the existence of the local path, and if it\
  \ does not exist downloads it locally from the provided URL before loading.\n  \
  \  trained_with_sensitive: Whether model training included the sensitive attributes\
  \ that will be analysed in the next step or not. Including those attributes could\
  \ help mitigate bias for some bias-aware training algorithms. Leave checked if you\
  \ just trained the model with all available attributes.\n"
parameter_info: Some parameters are needed.
component_type: LOADER_MODEL
parameter_default:
  path: ''
  trained_with_sensitive: true
output_types:
- ONNX
- Predictor
