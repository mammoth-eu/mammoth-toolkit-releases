id: croissant
name: croissant
description: 'Generate some json dataset metadata that boostraps conversion of your
  datasets into the

  <a href="https://github.com/mlcommons/croissant">Croissant</a> format. That format
  is used to

  standardized how datasets may be indexed and loaded. If your dataset is stored locally,
  such as

  in minio instances, you can consider either sharing the metadata to explain to others
  what you

  are working with, or using publicly hosted data by providing https links for files.

  Metadata are displayed as HTML to help you get an overview and are presented as
  a copy-able block of json.

  '
parameter_info: Some parameters are needed.
component_type: METRIC
input_types:
- Dataset
- Predictor
