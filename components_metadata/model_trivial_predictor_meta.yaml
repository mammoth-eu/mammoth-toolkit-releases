id: model_trivial_predictor
name: model trivial predictor
description: 'Creates a trivial predictor that returns the most common predictive
  label value among provided data.

  If the label is numeric, the median is computed instead. This model servers as an
  informed baseline

  of what happens even for an uninformed predictor. Several kinds of class biases
  may exist, for example

  due to different class imbalances for each sensitive attribute dimension (e.g.,
  for old white men

  compared to young hispanic women).'
parameter_info: No parameters needed.
component_type: LOADER_MODEL
parameter_default: {}
output_types:
- Predictor
- TrivialPredictor
