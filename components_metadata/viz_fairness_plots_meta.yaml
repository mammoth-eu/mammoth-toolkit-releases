id: viz_fairness_plots
name: viz fairness plots
description: "\n<img src=\"https://raw.githubusercontent.com/fairlearn/fairlearn/29f6d6f67eea061ae5dae72e976f2069cb38772e/docs/static_landing_page/images/fairlearn_logo.svg\"\
  \ alt=\"Based on FairLearn\" style=\"float: left; margin-right: 15px; margin-bottom:\
  \ 5px; height: 50px;\"/>\n\n<p>\nThis module visualizes fairness metrics using the\
  \ <a href=\"https://fairlearn.org/\" target=\"_blank\">Fairlearn</a> library and\
  \ interactive Plotly charts.\nIt provides visual insights into how a model performs\
  \ across different groups defined by sensitive features such as gender, race, or\
  \ age.\nTwo sets of visual outputs are processed:\n</p>\n<ul>\n    <li><strong>Group-wise\
  \ metrics</strong>: Shown as grouped bar charts, these display performance metrics\
  \ (e.g., false positive rate) across subgroups.</li>\n    <li><strong>Scalar metrics</strong>:\
  \ Displayed as horizontal bar charts, these summarize disparities (e.g., equal opportunity\
  \ difference) in a compact, interpretable format.</li>\n</ul>\n<p>\n    Interactive\
  \ charts allow users to hover for precise values, compare metrics between groups,\
  \ and quickly identify fairness gaps.\n    An explanation panel is included to define\
  \ each metric and guide interpretation.\n</p>\n<p>\n    This module is well suited\
  \ for exploratory analysis, presentations, and fairness monitoring.\n    It makes\
  \ group disparities visible and intuitive, helping identify where further scrutiny\
  \ or mitigation may be needed.\n</p>\n"
parameter_info: No parameters needed.
component_type: METRIC
input_types:
- Dataset
- Predictor
parameter_default: {}
output_types: []
