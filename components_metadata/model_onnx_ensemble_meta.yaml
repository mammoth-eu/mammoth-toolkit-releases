id: model_onnx_ensemble
name: model onnx ensemble
description: "<p>This ONNX Ensemble Module enables predictions using a <a href=\"\
  https://scikit-learn.org/stable/modules/ensemble.html\" target=\"_blank\">boosting\
  \ ensemble</a> mechanism, ideal for combining multiple weak learners to improve\
  \ prediction accuracy. Boosting, a powerful technique in machine learning, focuses\
  \ on training a series of simple models (weak learners) \u2013 often single-depth\
  \ <a href=\"https://scikit-learn.org/stable/modules/tree.html#classification\" target=\"\
  _blank\">decision trees</a> \u2013 and combining them into a strong ensemble model.</p>\n\
  \    <p><b>Usage Instructions:</b> To load a model, users need to supply a zip file\
  \ path. This zip file should include multiple weak learners, each saved in the ONNX\
  \ format, as well as parameters, such as weights (often denoted as \u2018alphas\u2019\
  ), that define each learner\u2019s contribution to the final model. For an example\
  \ of preparing this file, please see <a href=\"https://github.com/mammoth-eu/mammoth-commons/blob/dev/tests/test-mfppb-onnx-ensemble.ipynb\"\
  \ target=\"_blank\">our notebook</a>.</p>\n    <p>The module currently supports\
  \ the MMM-Fair Boosting Post Pareto (MFBPP) model, which is a specialized approach\
  \ that applies fairness-aware boosting. In particular, the MFBPP model leverages\
  \ multi-fairness metric MMM-fair (Multi-Max Mistreatment) to ensure that prediction\
  \ outcomes remain unbiased across different demographic groups (defined by protected\
  \ attributes) and achieves <i>Pareto optimality</i> by balancing fairness and predictive\
  \ performance across different class. For a detailed explanation of MFBPP, you can\
  \ refer to <a href=\"https://link.springer.com/chapter/10.1007/978-3-031-18840-4_21\"\
  \ target=\"_blank\">the paper</a>.</p>\n\n    <p><b>Train and upload: </b> To create\
  \ and integrate your own MFBPP trained on your intended data, please follow the\
  \ instructions given in our <a href=\"https://github.com/mammoth-eu/mammoth-commons/blob/dev/tests/test_mfppb_onnx_ensemble.ipynb\"\
  \ target=\"_blank\">Test instructions</a> notebook.</p>\n\n    Args:\n        path:\
  \ A zip file containing the ensemble elements such as weak learners, weight parameters,\
  \ etc.\n    "
parameter_info: Some parameters are needed.
component_type: LOADER_MODEL
parameter_default:
  path: ''
output_types:
- Predictor
- ONNXEnsemble
