id: data_uci
name: data uci
description: "\n<img src=\"https://storage.googleapis.com/kaggle-datasets-images/2417096/4083793/85e682cbc981e5214668824a9b0415c3/dataset-cover.jpg?t=2022-08-17-05-14-29\"\
  \ alt=\"Based on UCI\" style=\"float: left; margin-right: 5px; margin-top: 10px;\
  \ margin-bottom: 5px; height: 80px;\"/>\n\nLoads a dataset from the UCI Machine\
  \ Learning Repository (<a href=\"https://archive.ics.uci.edu/ml/index.php\" target=\"\
  _blank\">www.uci.org</a>) containing numeric, categorical, and predictive data columns.\
  \ The dataset is automatically downloaded from the repository, and basic preprocessing\
  \ is applied to identify the column types. The specified target column is treated\
  \ as the predictive label.\n    To customize the loading process (e.g., use a different\
  \ target column, load a subset of features, or handle missing data differently),\
  \ additional parameters or a custom loader can be used.\n\nArgs:\n    dataset_name:\
  \ The name of the dataset.\n\n    Options:\n        dataset_name: Credit, Bank,\
  \ Adult, KDD"
parameter_info: Some parameters are needed.
component_type: LOADER_DATA
parameter_default:
  dataset_name: None
