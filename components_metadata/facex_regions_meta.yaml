id: facex_regions
name: facex regions
description: "<a href=\"https://github.com/gsarridis/faceX\">FaceX</a> is a tool designed\
  \ to help you understand how\n        face attribute classifiers make decisions.\
  \ It\n        provides clear explanations by analyzing 19 key regions of the face,\
  \ such as the eyes, nose, mouth,\n        hair, and skin. This method helps reveal\
  \ which parts of the face the model focuses on when making\n        predictions\
  \ about attributes like age, gender, or race.\n\n        Rather than explaining\
  \ each individual image separately, FaceX aggregates information across the\n  \
  \      entire dataset, offering a broader view of the model's behavior. It looks\
  \ at how the model activates\n        different regions of the face for each decision.\
  \ This aggregated information helps\n        you see which facial features are most\
  \ influential in the model's predictions, and whether certain\n        features\
  \ are being emphasized more than others.\n\n        In addition to providing an\
  \ overall picture of which regions are important, FaceX also zooms in on\n     \
  \   specific areas of the face - such as a section of the skin or a part of the\
  \ hair - showing which\n        patches of the image have the highest impact on\
  \ the model's decision. This makes it easier to\n        identify potential biases\
  \ or problems in how the model is interpreting the face.\n\n        Overall, with\
  \ FaceX, you can quickly and easily get a better understanding of your model's\n\
  \        decision-making process. This is especially useful for ensuring that your\
  \ model is fair and\n        transparent, and for spotting any potential biases\
  \ that may\n        affect its performance.\n\n        <span class=\"alert alert-warning\
  \ alert-dismissible fade show\" role=\"alert\"\n        style=\"display: inline-block;\
  \ padding: 10px;\"> <i class=\"bi bi-exclamation-triangle-fill\"></i> GPU\n    \
  \    access is recommended as this analysis can be computationally intensive, especially\
  \ with large\n        datasets. </span>\n\n\n    Args:\n        target_class: This\
  \ parameter allows you to specify which class you want to analyze. For example,\
  \ if you are using the model to classify faces by gender, setting the target class\
  \ to male (i.e., the integer identifier for males class) will show you how the model\
  \ makes decisions about male faces.\n        target_layer: This parameter lets you\
  \ choose which part of the model's neural network you want to analyze. In simple\
  \ terms, a model consists of multiple layers that process information at different\
  \ levels. The target layer refers to the specific layer in the model that you want\
  \ to explain. The explanation will show you which regions of the face are most important\
  \ to that layer's decision-making process. For example, the deeper layers of the\
  \ model may focus on more complex features like facial structure, while earlier\
  \ layers might focus on simpler features like edges and textures. Typically, you\
  \ should opt for the last layer prior to the classification layer.\n    "
parameter_info: Some parameters are needed.
component_type: METRIC
input_types:
- Image
- Pytorch
parameter_default:
  target_class: 1
  target_layer: None
output_types: []
