id: sklearn_audit
name: sklearn audit
description: "\n<p>One way to evaluate the fairness of a dataset is by testing for\
  \ biases using simple models with limited\ndegrees of freedom. This module audits\
  \ datasets by training such models provided by the\n<a href=\"https://scikit-learn.org/stable/index.html\"\
  >scikit-learn</a> library on half of the dataset.\nThe second half is then used\
  \ as test data to assess predictive performance and detect classification\nor scoring\
  \ biases.</p>\n\n<p>Test data are used to generate a fairness and bias report with\
  \ the\n<a href=\"https://fairbench.readthedocs.io/\">FairBench</a> library. If strong\
  \ biases appear in the simple models\nthat are explored, they may also persist in\
  \ more complex models trained on the same data. To focus on the most\nsignificant\
  \ biases, adjust the minimum shown deviation parameter.\nThe report provides multiple\
  \ types of fairness and bias assessments and can be viewed in three different formats,\n\
  where the model card contains a subset of results but attaches to these socio-technical\
  \ concerns to be taken into\naccount:</p>\n<ol>\n    <li>A summary table of results.</li>\n\
  \    <li>A simplified model card with key fairness concerns.</li>\n    <li>A full\
  \ detailed report.</li>\n</ol>\n\n<p>The module's report summarizes how a model\
  \ behaves on a provided dataset across different population groups.\nThese groups\
  \ are based on sensitive attributes like gender, age, and race. Each attribute can\
  \ have multiple values,\nsuch as several genders or races. Numeric attributes, like\
  \ age, are normalized to the range [0,1] and treated\nas fuzzy values, where 0 indicates\
  \ membership to a fuzzy group of \"small\" values, and 1 indicates membership to\n\
  a fuzzy group of \"large\" values. A separate set of fairness metrics is calculated\
  \ for each prediction label.</p>\n\n<p>If intersectional subgroup analysis is enabled,\
  \ separate subgroups are created for each combination of sensitive\nattribute values.\
  \ However, if there are too many attributes, some groups will be small or empty.\
  \ Empty groups are\nignored in the analysis. The report may also include information\
  \ about built-in datasets.</p>\n\nArgs:\n    predictor: Which simple model should\
  \ be used.\n    intersectional: Whether to consider all non-empty group intersections\
  \ during analysis. This does nothing if there is only one sensitive attribute. It\
  \ could be computationally intensive if too many group intersections are selected.\n\
  \    compare_groups: Whether to compare groups pairwise, or each group to the behavior\
  \ of the whole population.\n    problematic_deviation: Sets up a threshold of when\
  \ to consider deviation from ideal values as problematic. If nothing is considered\
  \ problematic fairness is not necessarily achieved, but this is a good way to identify\
  \ the most prominent biases. If value of 0 is set, all report values are shown,\
  \ including those that have no ideal value.\n    show_non_problematic: Determine\
  \ whether deviations less than the problematic one should be shown or not. If they\
  \ are shown, the coloring scheme is adjusted to identify non-problematic values\
  \ as green and the rest as either orange or red.\n    top_recommendations: The number\
  \ of top recommendations in evaluation that emulates showing the respective data\
  \ samples to users when querying the trained model to give examples for each class\
  \ in the dataset. Common values in the literature are 1,3,5,10.\n\n    Options:\n\
  \        predictor: Logistic regression, Gaussian naive Bayes\n        compare_groups:\
  \ Pairwise, To the total population"
parameter_info: Some parameters are needed.
component_type: METRIC
input_types:
- CSV
- EmptyModel
parameter_default:
  predictor: None
  intersectional: false
  compare_groups: None
  problematic_deviation: 0.1
  show_non_problematic: false
  top_recommendations: 3
output_types: []
