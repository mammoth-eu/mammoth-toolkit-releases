id: data_images
name: data images
description: "\nLoads image data from a CSV file holding their sensitive and predictive\
  \ attribute\ndata, as well as paths relative to a root directory. Loaded images\
  \ are subjected to a Python transformation.\n\nArgs:\n    path: The path to the\
  \ CSV file containing information about the dataset.\n    image_root_dir: The root\
  \ directory where the actual image files are stored.\n    target: Indicates the\
  \ predictive attribute in the dataset.\n    batch_size: The batch size at which\
  \ images should be loaded.\n    shuffle: Whether to shuffle the loaded images.\n\
  \    data_transform_path: A path or implementation of a torchvision data transform.\
  \ Alternatively, paste the transformation code here.\n    transform_variable: The\
  \ transformation target variable that should be extracted after the namesake code\
  \ runs.\n    num_workers: Number of subprocesses to use for data loading.\n    safe_libraries:\
  \ A comma-separated list of safe libraries that are allowed in the transformation\
  \ code. As a safety measure against code injection attacks, an error will be created\
  \ if libraries other than those are encountered.\n"
parameter_info: Some parameters are needed.
component_type: LOADER_DATA
parameter_default:
  path: ''
  image_root_dir: ''
  target: ''
  batch_size: 4
  shuffle: false
  data_transform_path: ''
  transform_variable: transform
  num_workers: 0
  safe_libraries: numpy,torch,torchvision,PIL,io,requests,urllib
output_types:
- ImageLike
- Image
