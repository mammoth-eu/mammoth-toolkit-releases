id: data_read_any
name: data read any
description: "\n<img src=\"https://raw.githubusercontent.com/arjunroyihrpa/MMM_fair/main/images/mmm-fair.png\"\
  \ alt=\"Based on MMM-Fair\" style=\"float: left; margin-right: 5px; margin-bottom:\
  \ 5px; height: 80px;\"/>\n\nLoads a dataset for analysis from either a pre-loaded\
  \ pandas DataFrame or a file in one of the supported formats:\n`.csv`, `.xls`, `.xlsx`,\
  \ `.xlsm`, `.xlsb`, `.odf`, `.ods`, `.json`, `.html`, or `.htm`.\nThe module accepts\
  \ either a raw DataFrame or a file path (local or URL). If a file path is provided,\
  \ the data is\nautomatically loaded using the appropriate pandas function based\
  \ on the file extension. Basic preprocessing is applied\nto infer column types,\
  \ and the specified target column is treated as the predictive label.\n\nTo customize\
  \ the loading process (e.g., load a subset of columns, handle missing values, or\
  \ change column type inference),\nadditional parameters or a custom loader function\
  \ may be provided.\nThe Data loader module is recommended to load and process local\
  \ data also while training models which are intended to be tested\nusing the ONNXEnsemble\
  \ module.\n\nArgs:\n    dataset_path: Path or URL to the dataset file. Must have\
  \ one of the supported extensions.\n    target: The name of the column to treat\
  \ as the predictive label.\n"
parameter_info: Some parameters are needed.
component_type: LOADER_DATA
parameter_default:
  dataset_path: None
  target: None
output_types:
- CSV
- Dataset
