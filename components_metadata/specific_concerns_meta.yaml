id: specific_concerns
name: specific concerns
description: "\n<img src=\"https://fairbench.readthedocs.io/fairbench.png\" alt=\"\
  Based on FairBench\" style=\"float: left; margin-right: 5px; margin-bottom: 5px;\
  \ width: 80px;\"/>\n\n<p>Computes a fairness or bias measure that matches a specific\
  \ type of numerical\nevaluation using the <a href=\"https://github.com/mever-team/FairBench\"\
  >FairBench</a>\nlibrary. The measure is built by combining simpler options to form\
  \ more than 300 valid alternatives.</p>\n\n<span class=\"alert alert-warning alert-dismissible\
  \ fade show\" role=\"alert\"\nstyle=\"display: inline-block; padding: 10px;\"> <i\
  \ class=\"bi bi-exclamation-triangle-fill\"></i>\nThis computes a specific fairness\
  \ concerns and does not paint a broad enough picture. Make sure that\nyou explore\
  \ prospective biases with other modules first, like <i>model card</i>.</span>\n\n\
  <p>The assessment is conducted over sensitive attributes like gender, age, and race.\
  \ Each attribute can have multiple values,\nsuch as several genders or races. Numeric\
  \ attributes, like age, are normalized to the range [0,1] and treated\nas fuzzy\
  \ values, where 0 indicates membership to a fuzzy group of \"small\" values, and\
  \ 1 indicates membership to\na fuzzy group of \"large\" values. A separate set of\
  \ fairness metrics is calculated for each prediction label.</p>\n\n<p>If intersectional\
  \ subgroup analysis is enabled, separate subgroups are created for each combination\
  \ of sensitive\nattribute values. However, if there are too many attributes, some\
  \ groups will be small or empty. Empty groups are\nignored in the analysis. The\
  \ report may also include information about built-in datasets.</p>\n\nArgs:\n  \
  \  intersections: Whether to consider only the provided groups (Base), all non-empty\
  \ group intersections (All), or all non-empty intersections while ignoring larger\
  \ groups during analysis (Subgroups). For example, the last option may not contain\
  \ a `White` dimension if `White Men` is an existing dimension. This does nothing\
  \ if there is only one sensitive attribute. It could be computationally intensive\
  \ if too many group intersections are selected.\n    base_measure: A base measure\
  \ of algorithmic performance to be computed on each group.\n    compare_groups:\
  \ Whether to compare groups pairwise, or each group to the behavior of the whole\
  \ population.\n    reduction: The strategy with which to reduce all measure comparisons\
  \ to one value.\n    problematic_deviation: Sets up a threshold of when to consider\
  \ deviation from ideal values as problematic. If nothing is considered problematic\
  \ fairness is not necessarily achieved, but this is a good way to identify the most\
  \ prominent biases. If value of 0 is set, all report values are shown, including\
  \ those that have no ideal value.\n\n    Options:\n        intersections: Base,\
  \ All, Subgroups\n        base_measure: Accuracy, True positive rate, True negative\
  \ rate, Area under curve, Positive rate\n        compare_groups: Pairwise, To the\
  \ total population\n        reduction: Min, Max, Weighted mean, Max difference,\
  \ Max relative difference, Max betweeness area, Standard deviation x2, Gini coefficient"
parameter_info: Some parameters are needed.
component_type: METRIC
input_types:
- Dataset
- Predictor
parameter_default:
  intersections: Base
  base_measure: None
  compare_groups: None
  reduction: None
  problematic_deviation: 0.1
output_types: []
